[package]
name = "neutrino-core"
version = "0.1.0"
edition = "2021"
authors = ["Neutrino Browser Team"]
description = "Native privacy shield, tracker filter, and Mozilla native messaging bridge for Neutrino Browser."

[lib]
name = "neutrino_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "neutrino"
path = "src/app.rs"

[[bin]]
name = "neutrino-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
