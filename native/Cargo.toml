[package]
name = "neutrino-native"
version = "0.1.0"
edition = "2021"
authors = ["Neutrino Browser Team"]
description = "High-speed URL evaluation, Bloom filter tracker blocking, and native privacy core for Neutrino Browser."

[lib]
name = "neutrino_native"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "neutrino-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
byteorder = "1.5"
base64 = "0.22"

# Windows Hello user verification + DPAPI key unwrap for the password manager.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

